# Render Blueprint: one free web service that runs the backend and serves the web app.
# In Render: New -> Blueprint -> pick this repo. Render reads this file and the Dockerfile.
# Secrets are entered in the Render dashboard when it asks (sync: false), never stored here.
services:
  - type: web
    name: smart-water
    runtime: docker
    plan: free
    region: frankfurt           # same region as the Neon database
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true            # every push to GitHub redeploys
    envVars:
      - key: DATABASE_URL
        sync: false             # paste DATABASE_URL from .env.local (Neon, pooled) when prompted
      - key: Mqtt__Host
        sync: false             # EMQX deployment address
      - key: Mqtt__Username
        sync: false             # backend
      - key: Mqtt__Password
        sync: false             # the backend login's password
      - key: Jwt__Key
        generateValue: true     # Render makes a random key that signs login tokens
